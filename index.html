<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Lamp Animation</title>
    
قالب Tailwind CSS لتنسيق التصميم فوراً -->
    <script src="https://cdn.tailwindcss.com"></script>
    
مكتبات React و Babel لقراءة الكود في المتصفح -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
مكتبة الأيقونات Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-200">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function LampLoginAnimation() {
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [showPassword, setShowPassword] = useState(false);
          const [isLoading, setIsLoading] = useState(false);
          const [lampOn, setLampOn] = useState(false);

          const handleSubmit = (e) => {
            e.preventDefault();
            setIsLoading(true);
            setLampOn(true);

            setTimeout(() => {
              setIsLoading(false);
              alert('تم تسجيل الدخول بنجاح!');
            }, 2000);
          };

          return (
            <div className={`min-h-screen flex items-center justify-center transition-colors duration-700 relative overflow-hidden ${lampOn ? 'bg-slate-900 text-white' : 'bg-slate-950 text-gray-200'}`}>
              
              {/* تأثير إضاءة المصباح في الخلفية */}
              <div className={`absolute top-0 w-96 h-96 rounded-full blur-3xl transition-all duration-700 pointer-events-none ${lampOn ? 'bg-amber-500/20' : 'bg-amber-500/5'}`} />

              <div className="relative z-10 w-full max-w-md p-8 bg-slate-900/80 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-800">
                
                <div className="text-center mb-8">
                  <div className={`inline-flex p-3 rounded-full mb-4 transition-colors duration-500 ${lampOn ? 'bg-amber-500/20 text-amber-400 shadow-[0_0_20px_rgba(245,158,11,0.5)]' : 'bg-slate-800 text-slate-400'}`}>
                    <i data-lucide="lock" className="w-8 h-8"></i>
                  </div>
                  <h1 className="text-2xl font-bold">تسجيل الدخول</h1>
                  <p className="text-sm text-slate-400 mt-1">أدخل بيانات حسابك للمتابعة</p>
                </div>

                <form onSubmit={handleSubmit} className="space-y-6">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-2">البريد الإلكتروني</label>
                    <div className="relative">
                      <i data-lucide="mail" className="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                      <input
                        type="email"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        required
                        className="w-full pl-4 pr-10 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-sm transition-colors text-right"
                        placeholder="name@example.com"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-2">كلمة المرور</label>
                    <div className="relative">
                      <i data-lucide="lock" className="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                      <input
                        type={showPassword ? 'text' : 'password'}
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        required
                        className="w-full pl-10 pr-10 py-3 bg-slate-800/50 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-sm transition-colors text-right"
                        placeholder="••••••••"
                      />
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 cursor-pointer"
                      >
                        <i data-lucide={showPassword ? "eye-off" : "eye"} className="w-5 h-5"></i>
                      </button>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={isLoading}
                    className="w-full py-3 px-4 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition-all shadow-lg shadow-amber-500/20 disabled:opacity-50 flex items-center justify-center cursor-pointer"
                  >
                    {isLoading ? (
                      <span className="flex items-center gap-2">
                        <svg className="animate-spin h-5 w-5 text-slate-950" viewBox="0 0 24 24" fill="none">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        جاري تسجيل الدخول...
                      </span>
                    ) : (
                      'تسجيل الدخول'
                    )}
                  </button>
                </form>

              </div>
            </div>
          );
        }

        // تشغيل الأيقونات بعد تحميل المكون
        function App() {
          useEffect(() => {
            lucide.createIcons();
          });
          return <LampLoginAnimation />;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
