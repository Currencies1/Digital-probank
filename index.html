<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الصوتي الذكي - Hologram AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050b14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        /* تأثير التوهج النيوني المستوحى من صورتك */
        .hologram-glow {
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.2), inset 0 0 30px rgba(0, 200, 255, 0.2);
        }
        .core-pulse {
            animation: pulseCore 2s infinite alternate;
        }
        @keyframes pulseCore {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #ff6600); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 25px #ff9933); }
        }
        .listening-wave {
            animation: waveAnim 1.2s infinite ease-in-out;
        }
        @keyframes waveAnim {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 40px rgba(0, 220, 255, 0.6); }
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-between p-6">

    <!-- الهيدر -->
    <header class="text-center space-y-1">
        <h1 class="text-xl font-bold tracking-wider text-cyan-400">HOLOGRAPHIC AI CORE</h1>
        <p class="text-xs text-cyan-200/60">مساعدك الصوتي التفاعلي</p>
    </header>

    <!-- العنصر المرئي للشخصية (شبيه بالصورة) -->
    <div class="relative flex flex-col items-center justify-center my-auto">
        <div id="visualizerRing" class="w-64 h-64 rounded-full border-2 border-cyan-500/40 flex items-center justify-center hologram-glow transition-all duration-300">
            <!-- هيكل الشخصية النيوني باستخدام SVG -->
            <svg class="w-48 h-48 core-pulse" viewBox="0 0 24 24" fill="none" stroke="url(#blueGradient)" stroke-width="0.8">
                <defs>
                    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f2fe" />
                        <stop offset="100%" stop-color="#4facfe" />
                    </linearGradient>
                </defs>
                <!-- رسم تجريدي للرأس والكتفين الهولوغرامي -->
                <path d="M12 2C9.5 2 7.5 4 7.5 6.5C7.5 8 8.5 9.2 10 9.7C8 10.8 6.5 12.8 6 15.2C5 19.5 7 22 12 22C17 22 19 19.5 18 15.2C17.5 12.8 16 10.8 14 9.7C15.5 9.2 16.5 8 16.5 6.5C16.5 4 14.5 2 12 2Z" />
                <!-- القلب المتوهج البرتقالي في المنتصف -->
                <circle cx="12" cy="14" r="2.5" fill="#ff7700" filter="drop-shadow(0 0 6px #ff4500)" />
            </svg>
        </div>
        <!-- حالة النظام -->
        <div id="statusText" class="mt-6 text-sm tracking-widest text-cyan-300 bg-cyan-950/40 px-4 py-1.5 rounded-full border border-cyan-800/50 shadow-inner">
            اضغط على الميكروفون وابدأ التحدث...
        </div>
    </div>

    <!-- صندوق عرض الحوار الأخير -->
    <div class="w-full max-w-md bg-slate-900/80 border border-cyan-900/50 rounded-xl p-3 text-center text-xs text-slate-300 mb-4 min-h-[50px] flex items-center justify-center">
        <span id="transcript">الردود ستظهر هنا صوتياً ونزياً...</span>
    </div>

    <!-- زر التفاعل الصوتي -->
    <div class="mb-4">
        <button id="micBtn" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold p-5 rounded-full shadow-lg shadow-cyan-500/30 transition transform active:scale-95 flex items-center justify-center">
            <svg class="w-8 h-8 text-slate-950" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path>
            </svg>
        </button>
    </div>

    <!-- سكربت التحكم الصوتي والذكاء -->
    <script>
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        const transcript = document.getElementById('transcript');
        const visualizerRing = document.getElementById('visualizerRing');

        // التحقق من دعم المتصفح للتعرف على الصوت
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // اللغة العربية
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                statusText.innerText = "جاري الاستماع إليك... 🎙️";
                visualizerRing.classList.add('listening-wave');
            };

            recognition.onresult = function(event) {
                const userSpeech = event.results[0][0].transcript;
                transcript.innerText = "أنت: " + userSpeech;
                processAIResponse(userSpeech);
            };

            recognition.onerror = function(event) {
                statusText.innerText = "حدث خطأ في التقاط الصوت، حاول مجدداً.";
                visualizerRing.classList.remove('listening-wave');
            };

            recognition.onend = function() {
                visualizerRing.classList.remove('listening-wave');
            };
        } else {
            statusText.innerText = "متصفحك لا يدعم التعرف الصوتي المباشر.";
            micBtn.style.display = 'none';
        }

        // تشغيل الاستماع عند الضغط على زر الميكروفون
        micBtn.addEventListener('click', () => {
            if (recognition) {
                try {
                    recognition.start();
                } catch(e) {
                    recognition.stop();
                }
            }
        });

        // قاعدة الردود الذكية وتحويل النص إلى صوت (Text-to-Speech)
        function processAIResponse(message) {
            statusText.innerText = "جاري التفكير والرد...";
            const msg = message.toLowerCase();
            let reply = "أهلاً بك يا صديقي، أنا أستمع إليك بتمعن، كيف يمكنني مساعدتك في مشروعك اليوم؟";

            if (msg.includes('مرحبا') || msg.includes('اهلاً') || msg.includes('سلام')) {
                reply = "أهلاً ومرحباً بك! النظام يعمل بكامل الطاقة وجاهز لأي مشروع تقني أو برمجي.";
            } else if (msg.includes('برمجة') || msg.includes('كود') || msg.includes('موقع')) {
                reply = "ممتاز جداً! البرمجة هي ملعبي الأساسي، اطرح عليّ الفكرة ولنبدأ بكتابة الأكواد معاً.";
            } else if (msg.includes('اسمك') || msg.includes('من أنت')) {
                reply = "أنا نظامك الهولوغرامي الذكي، تم تصميمي خصيصاً لمساعدتك وإدارة أفكارك التقنية والبرمجية.";
            } else if (msg.includes('متة') || msg.includes('قهوة')) {
                reply = "يا سلام! رشفة متة ساخنة مع هدوء الليل وبرمجة الأكواد تصنع المستحيل.";
            }

            transcript.innerText = "النظام: " + reply;
            speakResponse(reply);
        }

        // دالة نطق الرد بصوت الآلة
        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // ايقاف أي نطق سابق
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 1.0;
                utterance.pitch = 0.9; // صوت ذكوري عميق قليلاً يناسب الطابع التقني

                utterance.onstart = () => {
                    statusText.innerText = "يتحدث الآن... 🔊";
                    visualizerRing.classList.add('listening-wave');
                };

                utterance.onend = () => {
                    statusText.innerText = "اضغط على الميكروفون وابدأ التحدث...";
                    visualizerRing.classList.remove('listening-wave');
                };

                window.speechSynthesis.speak(utterance);
            } else {
                statusText.innerText = reply;
            }
        }
    </script>
</body>
</html>
