<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>رسم شخصيتي باستخدام HTML و SVG</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        svg {
            background: #2c2c2c;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        p {
            margin-top: 20px;
            font-size: 18px;
            color: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>شخصيتك المستوحاة من الصورة</h2>
        <!-- كود SVG يمثل الشخصية ضمن إطار دائري شبيه بالمرآة -->
        <svg width="320" height="320" viewBox="0 0 300 300">
            <!-- إطار المرآة الخارجي المزخرف -->
            <circle cx="150" cy="150" r="145" fill="none" stroke="#d4af37" stroke-width="8" />
            <circle cx="150" cy="150" r="140" fill="#111" />
            
            <!-- الخلفية داخل المرآة -->
            <rect x="20" y="20" width="260" height="260" rx="130" fill="#222" />
            
            <!-- الكتفين والقميص الأسود -->
            <path d="M 80 300 Q 150 190 220 300 Z" fill="#1c1c1c" />
            
            <!-- الجسم والذراع المفتولة التي تحمل الهاتف -->
            <path d="M 90 220 C 70 200 65 170 95 165 C 115 160 135 180 145 200 Z" fill="#d29d76" />
            <rect x="135" y="150" width="25" height="45" rx="5" fill="#333" stroke="#555" stroke-width="2" />
            
            <!-- العنق -->
            <path d="M 125 160 L 125 130 L 175 130 L 175 160 Z" fill="#d29d76" />
            
            <!-- الرأس والوجه -->
            <ellipse cx="150" cy="95" rx="35" ry="45" fill="#d29d76" />
            
            <!-- الشعر الأسود القصير -->
            <path d="M 118 75 C 120 48 180 48 182 75 C 175 58 125 58 118 75 Z" fill="#111" />
            
            <!-- اللحية والشارب -->
            <path d="M 120 100 Q 150 145 180 100 Q 175 132 150 138 Q 125 132 120 100 Z" fill="#1a1a1a" />
            <path d="M 135 102 Q 150 115 165 102 Q 150 108 135 102 Z" fill="#1a1a1a" />
            
            <!-- العينان والحواجب -->
            <line x1="130" y1="85" x2="145" y2="83" stroke="#111" stroke-width="3" stroke-linecap="round" />
            <line x1="155" y1="83" x2="170" y2="85" stroke="#111" stroke-width="3" stroke-linecap="round" />
            <circle cx="137" cy="90" r="3" fill="#111" />
            <circle cx="163" cy="90" r="3" fill="#111" />
            
            <!-- التيشيرت الأسود والتفاصيل الأمامية -->
            <path d="M 95 190 Q 150 165 205 190 L 220 300 L 80 300 Z" fill="#1c1c1c" />
        </svg>
        <p>قم بنسخ هذا الكود ولصقه في ملف نصي، ثم احفظه بامتداد <code>index.html</code> وافتحه بأي متصفح إنترنت!</p>
    </div>
</body>
</html>
