<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>وردة وقلب واسم ندى المتحرك</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #000;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let progress = 0;

        function drawHeart(x, y, size, strokeColor, fillColor) {
            ctx.save();
            ctx.beginPath();
            ctx.translate(x, y);
            ctx.scale(size, size);
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(0, -3, -5, -15, -25, -15);
            ctx.bezierCurveTo(-55, -15, -55, 25, -55, 25);
            ctx.bezierCurveTo(-55, 45, -35, 65, 0, 85);
            ctx.bezierCurveTo(35, 65, 55, 45, 55, 25);
            ctx.bezierCurveTo(55, 25, 55, -15, 25, -15);
            ctx.bezierCurveTo(10, -15, 0, -3, 0, 0);
            
            if (fillColor) {
                ctx.fillStyle = fillColor;
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff0033';
                ctx.fill();
            }
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 4;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0033';
                ctx.stroke();
            }
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 40;

            if (progress < 1) progress += 0.015;
            let currentScale = Math.min(progress, 1);

            // رسم قلب الحب المضيء في الخلفية
            drawHeart(centerX, centerY, currentScale * 1.6, '#ff1a40', 'rgba(255, 0, 51, 0.15)');

            // رسم الوردة المتحركة في المنتصف
            ctx.save();
            ctx.translate(centerX, centerY + 10);
            let roseScale = currentScale * 45;
            ctx.beginPath();
            for (let phi = 0; phi < 2 * Math.PI; phi += 0.01) {
                let k = 4; // عدد بتلات الوردة
                let r = roseScale * Math.sin(k * phi);
                let x = r * Math.cos(phi);
                let y = r * Math.sin(phi);
                if (phi === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fillStyle = '#ff1a40';
            ctx.shadowBlur = 35;
            ctx.shadowColor = '#ff0044';
            ctx.fill();
            ctx.restore();

            // كتابة اسم "ندى" بخط متوهج متحرك
            ctx.save();
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffd700'; // لون ذهبي براق
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffaa00';
            ctx.globalAlpha = currentScale; // ظهور تدريجي مع تفتح الوردة
            ctx.fillText("ندى", centerX, centerY + 170);
            ctx.restore();

            if (progress < 1) {
                requestAnimationFrame(animate);
            }
        }

        animate();

        // إعادة تشغيل الحركة عند النقر على الشاشة
        canvas.addEventListener('click', () => {
            progress = 0;
            animate();
        });
    </script>

</body>
</html>
