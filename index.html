<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>وردة تتفتح برمجياً</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #000;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="flowerCanvas"></canvas>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let scale = 0;
        const maxScale = 1;

        function drawFlower() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            ctx.beginPath();
            // معادلة رياضية لرسم البتلات (Rose Curve)
            let currentScale = scale;
            for (let phi = 0; phi < 2 * Math.PI; phi += 0.005) {
                let k = 4; // عدد البتلات
                let r = 180 * Math.sin(k * phi) * currentScale;
                let x = r * Math.cos(phi);
                let y = r * Math.sin(phi);
                if (phi === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();

            // تصميم لون الوردة الأحمر الزاهي مع تأثير الإضاءة
            ctx.fillStyle = '#ff1a40';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff0033';
            ctx.fill();
            
            ctx.strokeStyle = '#ff4d6d';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // حركة التفتح التدريجي
            if (scale < maxScale) {
                scale += 0.01;
                requestAnimationFrame(drawFlower);
            }
        }

        // إعادة تشغيل الحركة عند النقر على الشاشة
        canvas.addEventListener('click', () => {
            scale = 0;
            drawFlower();
        });

        drawFlower();
    </script>

</body>
</html>
