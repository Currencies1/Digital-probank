<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محادثة مع صديقك التقني - زياد</title>
    <!-- استخدام Tailwind CSS لتصميم عصري وسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- الهيدر (رأس الصفحة) -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="relative">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-xl font-bold shadow-lg">
                    👨‍💻
                </div>
                <span class="absolute bottom-0 left-0 w-3.5 h-3.5 bg-green-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div>
                <h1 class="font-bold text-lg">زياد (صديقك التقني)</h1>
                <p class="text-xs text-slate-400">جاهز للدردشة، البرمجة، وتطوير الأفكار معك</p>
            </div>
        </div>
        <div class="text-xs bg-slate-800 px-3 py-1.5 rounded-full text-slate-300 border border-slate-700">
            متصل الآن 🟢
        </div>
    </header>

    <!-- منطقة المحادثة -->
    <main id="chatBox" class="chat-container flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <!-- رسالة الترحيب من الشخصية -->
        <div class="flex items-start space-x-2 space-x-reverse">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm shrink-0">👨‍💻</div>
            <div class="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl rounded-tr-none max-w-[80%] text-sm leading-relaxed shadow-sm">
                أهلاً يا صديقي! منور الجلسة اليوم. قول لي، شو المشروع أو الفكرة اللي عم تفكر فيها حالياً؟ خليني أساعدك نضبط الأكواد ونظبط الدنيا سوا ☕🔥
            </div>
        </div>
    </main>

    <!-- صندوق الإدخال (أسفل الصفحة) -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3">
        <form id="chatForm" class="max-w-3xl mx-auto flex items-center space-x-2 space-x-reverse">
            <input 
                type="text" 
                id="userInput" 
                placeholder="اكتب رسالتك هنا... (مثلاً: كيف نعمل صفحة ويب؟ أو ساعدني ببرمجة تطبيق)" 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500"
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl text-sm font-medium transition shadow-lg flex items-center justify-center shrink-0">
                إرسال 🚀
            </button>
        </form>
    </footer>

    <!-- سكربت التفاعل الذكي للشخصية -->
    <script>
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        // قاعدة معرفة وردود تفاعلية لشخصية "زياد" التقنية
        function getZiadResponse(message) {
            const msg = message.toLowerCase();
            
            if (msg.includes('مرحبا') || msg.includes('اهلاً') || msg.includes('السلام')) {
                return "هلا فيك يا غالي! كيف الأمور معك اليوم؟ جاهز للشغل ولَّا رايق؟";
            } else if (msg.includes('برمجة') || msg.includes('كود') || msg.includes('موقع') || msg.includes('تطبيق')) {
                return "البرمجة ملعبي! اعطيني تفاصيل المشروع اللي بدك ياه (سواء HTML، Node.js، بايثون، أو واجهات)، وبأي آلية حبّيت نبدأ فيه؟";
            } else if (msg.includes('متة') || msg.includes('قهوة') || msg.includes('شاي')) {
                return "يا سلام! أحلى رشفة متة مع البرمجة والكود الرايق، بتعطيك تركيز فولاذي. صب كاسة وتعال نكمل شغل! 🌿🧉";
            } else if (msg.includes('مشروع') || msg.includes('تطوير')) {
                return "جميل جداً! بناء المشاريع هو أمتع شي. احكي لي شو الفكرة الأساسية، وخليني أرتب لك الأفكار والخطوات التقنية لننفذها سوا.";
            } else {
                return "كلام جميل يا صديقي.. أنا معك عم بتابع الفكرة. خبرني أكثر أو اطرح عليّ التفاصيل التقنية اللي بدك إياها لنحلها سوا خطوة بخطوة!";
            }
        }

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // إضافة رسالة المستخدم
            appendMessage(text, 'user');
            userInput.value = '';

            // محاكاة تفكير الشخصية لثانية واحدة لإعطاء واقعية
            setTimeout(() => {
                const reply = getZiadResponse(text);
                appendMessage(reply, 'bot');
            }, 800);
        });

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-2 space-x-reverse ${isUser ? 'justify-end' : ''}`;

            if (!isUser) {
                wrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm shrink-0">👨‍💻</div>
                    <div class="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl rounded-tr-none max-w-[80%] text-sm leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="bg-indigo-600 text-white p-3.5 rounded-2xl rounded-tl-none max-w-[80%] text-sm leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                `;
            }

            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
